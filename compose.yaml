services:
  agentos-db:
    image: agnohq/pgvector:18
    container_name: agentos-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS:-ai}
      POSTGRES_DB: ${DB_DATABASE:-ai}
    networks:
      - agentos

  agentos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentos-api
    image: ${IMAGE_NAME:-agentos}:${IMAGE_TAG:-latest}
    # --reload-dir limits the watcher to dirs that contain runtime code.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir agents --reload-dir app --reload-dir db --reload-dir evals --reload-dir teams --reload-dir workflows
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      RUNTIME_ENV: dev
      AGNO_DEBUG: "True"
      WAIT_FOR_DB: "True"
      AGENTOS_URL: http://127.0.0.1:8000
      DB_HOST: agentos-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ai}
      DB_PASS: ${DB_PASS:-ai}
      DB_DATABASE: ${DB_DATABASE:-ai}
    depends_on:
      - agentos-db
    networks:
      - agentos
    extra_hosts:
      - "host.docker.internal:host-gateway"

  support-inbox-db:
    image: postgres:16
    container_name: support-inbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SUPPORT_DB_USER:-support_inbox}
      POSTGRES_PASSWORD: ${SUPPORT_DB_PASSWORD:-support_inbox}
      POSTGRES_DB: ${SUPPORT_DB_NAME:-support_inbox}
    volumes:
      - support_inbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - agentos

  support-inbox-migrate:
    build:
      context: ./support-inbox/bff
      dockerfile: Dockerfile
    container_name: support-inbox-migrate
    restart: "no"
    environment:
      PYTHONPATH: /service
      DATABASE_URL: postgresql+psycopg://${SUPPORT_DB_USER:-support_inbox}:${SUPPORT_DB_PASSWORD:-support_inbox}@support-inbox-db:5432/${SUPPORT_DB_NAME:-support_inbox}
      SUPPORT_OPERATOR_USERNAME: ${SUPPORT_OPERATOR_USERNAME:-local.operator}
      SUPPORT_OPERATOR_PASSWORD: ${SUPPORT_OPERATOR_PASSWORD:-local-support-password}
      SUPPORT_OPERATOR_DISPLAY_NAME: ${SUPPORT_OPERATOR_DISPLAY_NAME:-Local Support Operator}
    command: >
      sh -c "alembic upgrade head && python -m app.seed_operator"
    depends_on:
      support-inbox-db:
        condition: service_healthy
    networks:
      - agentos

  support-inbox-bff:
    build:
      context: ./support-inbox/bff
      dockerfile: Dockerfile
    container_name: support-inbox-bff
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      RUNTIME_ENV: dev
      DATABASE_URL: postgresql+psycopg://${SUPPORT_DB_USER:-support_inbox}:${SUPPORT_DB_PASSWORD:-support_inbox}@support-inbox-db:5432/${SUPPORT_DB_NAME:-support_inbox}
      AGENTOS_BASE_URL: http://agentos-api:8000
      AGENTOS_PAT: ${AGENTOS_PAT:-}
      SUPPORT_ALLOWED_ORIGINS: http://localhost:8000
      SUPPORT_COOKIE_SECURE: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      support-inbox-db:
        condition: service_healthy
      support-inbox-migrate:
        condition: service_completed_successfully
      agentos-api:
        condition: service_started
    networks:
      - agentos

networks:
  agentos:

volumes:
  pgdata:
  support_inbox_pgdata:
